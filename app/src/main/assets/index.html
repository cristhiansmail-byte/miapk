<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIAPK</title>
<style>
:root{
  --tinta:#19324A; --turq:#16A6A2; --turq-osc:#0B716D; --pizarra:#526270;
  --bg:#F8FAFB; --card:#FFFFFF; --txt:#19324A; --sub:#526270; --line:#E3E8EC;
  --ok:#0B716D; --warn:#9A6700; --pend:#526270; --err:#B42318;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F2133; --card:#19324A; --txt:#F8FAFB; --sub:#B9C6D0; --line:#2A4560;
         --ok:#16A6A2; --pend:#B9C6D0; --warn:#E3B341; --err:#F97066; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,Inter,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--txt);
  -webkit-tap-highlight-color:transparent;padding-bottom:76px}
header{background:var(--tinta);color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:20px;letter-spacing:.5px}
.brand small{display:block;font-size:12px;color:#B9C6D0;font-weight:500}
header h1{font-size:15px;font-weight:600;margin-top:10px;color:#DDF3F2}
.upd{position:absolute;right:14px;top:18px;background:rgba(22,166,162,.18);color:#DDF3F2;border:1px solid #16A6A2;border-radius:999px;font:inherit;font-size:12px;font-weight:700;padding:7px 12px}
.upd svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.btn{display:block;width:100%;text-align:center;background:var(--turq-osc);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:14px;border-radius:12px;margin:6px 0}
@media (prefers-color-scheme: dark){ .btn{background:var(--turq);color:#0F2133} }
.legend .row .t{font-size:13px}
input.f{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);margin:6px 0}
.btn2{display:block;width:100%;text-align:center;background:none;color:var(--turq-osc);border:1px solid var(--turq-osc);font:inherit;font-weight:700;font-size:14px;padding:12px;border-radius:12px;margin:6px 0}
.msg{font-size:13px;margin-top:8px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.qr{background:#fff;border-radius:12px;padding:10px;text-align:center}.qr img{width:200px;height:200px}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:6px}
.card p,.card li{font-size:14px;line-height:1.45;color:var(--sub)}
.card ul{padding-left:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-size:14px;font-weight:600}
.row .d{font-size:12.5px;color:var(--sub);margin-top:2px}
.tap{cursor:pointer}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.b-ok{color:var(--ok)} .b-pend{color:var(--pend)} .b-warn{color:var(--warn)} .b-err{color:var(--err)}
.sec{font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--sub);margin:16px 2px 8px;text-transform:uppercase}
.note{font-size:12px;color:var(--sub);text-align:center;margin:18px 6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--sub);font:inherit;font-size:11px;font-weight:600;padding:6px 0;border-radius:10px}
nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav button.on{color:var(--turq-osc)}
@media (prefers-color-scheme: dark){ nav button.on{color:var(--turq)} }
.back{display:inline-block;margin-bottom:10px;color:var(--turq-osc);font-weight:700;font-size:14px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.quote{border-left:3px solid var(--turq);padding-left:10px;font-style:italic}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 108 108" aria-hidden="true"><path fill="#16A6A2" d="M30,32h48a6,6 0 0 1 6,6v26a6,6 0 0 1-6,6h-30l-10,9v-9h-8a6,6 0 0 1-6-6v-26a6,6 0 0 1 6-6z"/><path fill="#fff" d="M33,64l12-12l8,8l6-6l13,10z"/></svg>

</header>
<main id="vista"></main>
<nav id="nav"></nav>

const Auth = {

  const tok=Auth.s.access_token; const c=Auth.claims(); const vigMin=Math.round(((c.exp||0)-(c.iat||0))/60);
  const h={apikey:SB.key,Authorization:"Bearer "+tok,"Accept-Profile":"miapk"};
  const leer=async()=>{ const r=await fetch(SB.url+"/rest/v1/programas?select=id",{headers:{...h,Prefer:"count=exact",Range:"0-0"}}); return r.ok?(r.headers.get("content-range")||"*/?").split("/")[1]:"rechazado ("+r.status+")"; };
  const aprobar=async(id)=>{ const r=await fetch(SB.url+"/rest/v1/rpc/osi_aprobar",{method:"POST",headers:{...h,"Content-Profile":"miapk","Content-Type":"application/json"},body:JSON.stringify({p_version_id:id,p_texto_literal:"prueba F2-H2 de revocación"})}); let j=null; try{ j=await r.json(); }catch(e){} return r.ok?(j&&j.estado)||"?":"rechazado ("+r.status+")"; };
  let id=null; try{ const r=await fetch(SB.url+"/rest/v1/v_osi_integridad?select=version_id&estado=eq.vigente",{headers:h}); id=((await r.json())[0]||{}).version_id; }catch(e){}
  const antes=await leer();
  el.innerHTML=`<p class="msg">Probando «${modo}»… no cierres la app (hasta 60 s).</p>`;
  const t0=Date.now(); let accion="";
  if(modo=="cerrar sesión"){ const v=Auth.s; Auth.borrar(); accion=(await Auth.revocarCon(v,"local"))?"servidor confirmó":"servidor NO confirmó"; }
  else if(modo=="todos los dispositivos"){ const r=await Auth.salirTodos(); accion=r.n!==null?"servidor cerró "+r.n+" sesión(es)":"servidor NO confirmó"; }
  else { Auth.s.ultimo=Date.now()-INACTIVIDAD_MS-1000; Auth.guardar(); Auth.cargar(); accion=(await Auth.revocando)?"servidor confirmó":"servidor NO confirmó"; }
  const filas=[]; let ok=false, seg=0;
  for(let i=0;i<20;i++){ seg=Math.round((Date.now()-t0)/1000); const n=await leer(), a=id?await aprobar(id):"sin documento";
    filas.push(row(seg+" s","programas: "+n+" · aprobar OSI: "+a,""));
    if((n==="0"||/rechazado/.test(n)) && /rechazado/.test(a)){ ok=true; break; } await new Promise(r=>setTimeout(r,3000)); }
  el.innerHTML=`<div class="card"><h2>Prueba de revocación · ${modo}</h2><p class="note">${new Date().toLocaleString("es-CO",{hour12:false})} · acceso anterior guardado solo en memoria · vigencia del acceso: ${vigMin} min</p>
    ${row("Antes de cerrar","programas: "+antes,"")}${row("Cierre",accion,"")}${filas.join("")}
    <p class="msg ${ok?"ok":"err"}">${ok?"PASA: el acceso anterior quedó sin permisos a los "+seg+" s":"FALLA: el acceso anterior seguía con permisos a los "+seg+" s"}</p></div>`;
}
async function accSalirTodos(){ const r=await Auth.salirTodos(); pendienteQR=null;
  if(r.n!==null) verAcceso("Se cerraron "+r.n+" sesiones en todos los dispositivos."+(r.msg.length?" ("+r.msg.join(" · ")+")":""),"ok");
  else verAcceso("No se pudo confirmar el cierre en el servidor: "+r.msg.join(" · ")+". Esta sesión local sí se cerró.","err"); }
document.addEventListener("click",()=>Auth.tocar(),true);
setInterval(()=>{ Auth.cargar(); if(!Auth.s && Auth.aviso && document.getElementById("titulo").textContent=="Acceso seguro") verAcceso(); },60000);
Auth.cargar();
let actual="Pulso", detalle=false;
function ir(n){ actual=n; detalle=false;
  document.getElementById("titulo").textContent=n;
  document.getElementById("vista").innerHTML=`<p class="note">Referencia · sin conexión</p>`+V[n]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==n));
  window.scrollTo(0,0);
}
function verOrden(tipo,i){ const o=D.ordenes[i]; detalle=true;
  document.getElementById("titulo").textContent=o.id;
  document.getElementById("vista").innerHTML=`<a class="back" onclick="ir(actual)">← Volver</a>
   <div class="card"><h2>${o.t}</h2>${row("Estado",o.o,pill(o.e,o.c))}${row("Presupuesto autorizado",o.p)}</div>
   <div class="sec">Avance</div><div class="card"><ul>${o.d.map(x=>`<li>${x}</li>`).join("")}</ul></div>${pie}`;
  window.scrollTo(0,0);
}
window.miapkBack=()=>{ if(detalle){ir(actual);return true;} if(actual!="Pulso"){ir("Pulso");return true;} return false; };
document.getElementById("nav").innerHTML=Object.keys(V).map(n=>`<button data-v="${n}" onclick="ir('${n}')"><svg viewBox="0 0 24 24">${iconos[n]}</svg>${n}</button>`).join("");
ir("Pulso");
</script>
